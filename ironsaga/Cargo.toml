[package]
name = "ironsaga"
edition = "2024"
version = "0.1.0"
authors = ["ALAWIII"]
description = "Command pipeline orchestration with automatic LIFO rollback and recursive compensation, for sync and async Rust workflows."
license = "MIT"
repository = "https://github.com/ALAWIII/ironsaga"
homepage = "https://github.com/ALAWIII/ironsaga"
documentation = "https://docs.rs/ironsaga"
readme = "../README.md"
keywords = ["saga", "command", "pipeline", "rollback", "async"]
categories = ["asynchronous", "rust-patterns"]

[dependencies]
ironsaga-macros = { path = "../ironsaga-macros", version = "0.1.0" }
async-trait = "0.1"
anyhow = "1"


[dev-dependencies]
macrotest = "1.2.1"
trybuild = "1.0.116"
